version: '3.8'

networks:
  aegisflow-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data_0:
  redis_data_1:
  redis_data_2:
  redis_data_3:
  redis_data_4:
  redis_data_5:

services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: aegisflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegisflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - aegisflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegisflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis Cluster Nodes (3 Masters, 3 Replicas)
  # ==========================================
  redis-node-0:
    image: docker.io/bitnami/redis-cluster:7.4
    container_name: redis-node-0
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=bitnami
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    volumes:
      - redis_data_0:/bitnami/redis/data
    networks:
      - aegisflow-net

  redis-node-1:
    image: docker.io/bitnami/redis-cluster:7.4
    container_name: redis-node-1
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=bitnami
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    volumes:
      - redis_data_1:/bitnami/redis/data
    networks:
      - aegisflow-net

  redis-node-2:
    image: docker.io/bitnami/redis-cluster:7.4
    container_name: redis-node-2
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=bitnami
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    volumes:
      - redis_data_2:/bitnami/redis/data
    networks:
      - aegisflow-net

  redis-node-3:
    image: docker.io/bitnami/redis-cluster:7.4
    container_name: redis-node-3
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=bitnami
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    volumes:
      - redis_data_3:/bitnami/redis/data
    networks:
      - aegisflow-net

  redis-node-4:
    image: docker.io/bitnami/redis-cluster:7.4
    container_name: redis-node-4
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=bitnami
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    volumes:
      - redis_data_4:/bitnami/redis/data
    networks:
      - aegisflow-net

  # Node 5 acts as the cluster coordinator, executing 'redis-cli --cluster create' automatically
  redis-node-5:
    image: docker.io/bitnami/redis-cluster:7.4
    container_name: redis-node-5
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=bitnami
      - REDISCLI_AUTH=bitnami
      - REDIS_CLUSTER_REPLICAS=1
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
      - REDIS_CLUSTER_CREATOR=yes
    volumes:
      - redis_data_5:/bitnami/redis/data
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
    networks:
      - aegisflow-net

  # ==========================================
  # 3. AegisFlow Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisflow-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/aegisflow_db
      - REDIS_CLUSTER_NODES=redis-node-0:6379,redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379
      - REDIS_PASSWORD=bitnami
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-node-5:
        condition: service_started
    networks:
      - aegisflow-net
